# Dark football-analytics theme (Step 8). Sans-serif text, monospace numbers, one bright accent.
# Roboto is used because its digits are equal-width by default, so numbers line up in tables.
[theme]
base = "dark"
primaryColor = "#22D3EE"
backgroundColor = "#0B0F14"
secondaryBackgroundColor = "#151B23"
textColor = "#E6EDF3"
linkColor = "#22D3EE"
borderColor = "#2A3441"
codeBackgroundColor = "#151B23"
dataframeBorderColor = "#222B36"
dataframeHeaderBackgroundColor = "#151B23"
dataframeHeaderTextColor = "#9AA7B4"
greenColor = "#2ECC71"
redColor = "#FF4D4F"
font = "Roboto:https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
headingFont = "Roboto:https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
baseFontSize = 15
headingFontWeights = 700
headingFontSizes = ["1.9rem", "1.3rem", "1.05rem"]
metricValueFontSize = "1.6rem"
baseRadius = "medium"
showWidgetBorder = true
paddingTop = "1.25rem"
paddingBottom = "3rem"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
